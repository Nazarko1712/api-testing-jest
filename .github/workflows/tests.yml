name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The target is a public demo instance — nightly runs surface its drift,
    # including the day a documented defect gets fixed.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run suite
        run: npm test
        env:
          CI: true
